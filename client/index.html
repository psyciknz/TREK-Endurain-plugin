<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endurain Import</title>
  <!-- trek:ui -->
  <style>
    body { background: transparent; }
    .page { max-width: 900px; margin: 0 auto; padding: 28px 24px 40px; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: 23px; }
    .subtitle { margin: 0; color: var(--text-muted); line-height: 1.5; }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px; margin-bottom: 14px; }
    .filter label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 12px; }
    .filter input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border-primary); border-radius: var(--radius-sm); background: var(--bg-input); color: var(--text-primary); font: inherit; }
    .filter-action { align-self: end; }
    .toolbar .trek-btn { white-space: nowrap; }
    .summary { color: var(--text-muted); font-size: 13px; margin-left: auto; }
    .list { display: grid; gap: 8px; }
    .activity { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: var(--radius-md); }
    .activity:hover { border-color: var(--accent); }
    .activity input { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
    .activity-main { min-width: 0; flex: 1; }
    .activity-name { font-weight: 650; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .activity-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 5px; color: var(--text-muted); font-size: 12px; }
    .empty, .error { padding: 28px; text-align: center; border: 1px dashed var(--border-primary); border-radius: var(--radius-md); color: var(--text-muted); }
    .error { color: var(--danger); background: var(--danger-soft); border-style: solid; }
    .status { min-height: 22px; margin: 12px 0; color: var(--text-muted); font-size: 13px; }
    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }
    .search-btn{background:var(--accent);border:none;border-radius:var(--radius-sm);padding:0 20px;height:38px;color:var(--accent-text);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .12s;align-self:end;}
    .search-btn:hover:not(:disabled){background:var(--accent-hover);}
    .search-btn:disabled{opacity:.
    @media (max-width: 560px) {
      .page { padding: 20px 16px 28px; }
      .header { display: block; }
      .toolbar { align-items: stretch; flex-wrap: wrap; }
      .filters { grid-template-columns: 1fr 1fr; }
      .summary { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>Import from Endurain</h1>
        <p class="subtitle">Select recorded activities and add their starting locations to the open TREK trip.</p>
      </div>
      <button id="refresh" class="search-btn trek-btn--secondary" type="button">Refresh</button>
    </header>

    <div class="toolbar">
      <button id="import" class="trek-btn trek-btn--primary" type="button" disabled>Import selected</button>
      <button id="select-all" class="trek-btn trek-btn--ghost" type="button">Select all</button>
      <span id="summary" class="summary"></span>
    </div>
    <div class="filters">
      <div class="filter"><label for="start-date">From</label><input id="start-date" type="date"></div>
      <div class="filter"><label for="end-date">To</label><input id="end-date" type="date"></div>
      <div class="filter"><label for="name-search">Activity name</label><input id="name-search" type="search" placeholder="Search activity names"></div>
      <button id="search" class="search-btn trek-btn--secondary filter-action" type="button" onclick="loadActivities()">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:-2px;margin-right:5px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Search
      </button>
    </div>
    <div id="status" class="status" role="status"></div>
    <section id="activities" class="list" aria-live="polite"></section>
  </main>

  <script>
    (function () {
      'use strict';
      var activities = [];
      var tripId = null;
      var busy = false;
      var list = document.getElementById('activities');
      var status = document.getElementById('status');
      var importButton = document.getElementById('import');
      var selectAllButton = document.getElementById('select-all');
      var summary = document.getElementById('summary');
      var startDate = document.getElementById('start-date');
      var endDate = document.getElementById('end-date');
      var nameSearch = document.getElementById('name-search');
      var searchButton = document.getElementById('search');
      var contextReady = false;

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }

      function formatDistance(value) {
        if (value == null || value === '') return '';
        var meters = Number(value);
        return Number.isFinite(meters) ? (meters / 1000).toFixed(1) + ' km' : String(value);
      }

      function setStatus(message, kind) {
        status.textContent = message || '';
        status.className = 'status' + (kind ? ' ' + kind : '');
      }

      function selectedIds() {
        return Array.prototype.slice.call(list.querySelectorAll('input[type=checkbox]:checked')).map(function (input) {
          return input.value;
        });
      }

      function updateControls() {
        var count = selectedIds().length;
        importButton.disabled = busy || !tripId || count === 0;
        importButton.textContent = count ? 'Import ' + count + ' selected' : 'Import selected';
        summary.textContent = activities.length + ' activities' + (tripId ? '' : ' · open a trip to import');
      }

      function render() {
        if (!activities.length) {
          list.innerHTML = '<div class="empty">No Endurain activities were returned.</div>';
          updateControls();
          return;
        }
        list.innerHTML = activities.map(function (activity) {
          var meta = [activity.date, activity.sport, formatDistance(activity.distance)].filter(Boolean).map(escapeHtml).join(' · ');
          return '<label class="activity">' +
            '<input type="checkbox" value="' + escapeHtml(activity.id) + '" aria-label="Select ' + escapeHtml(activity.name) + '">' +
            '<span class="activity-main"><span class="activity-name">' + escapeHtml(activity.name) + '</span>' +
            '<span class="activity-meta">' + (meta || 'No date or sport metadata') + '</span></span></label>';
        }).join('');
        updateControls();
      }

      function loadActivities() {
        if (busy) return;
        setStatus('Loading activities…');
        list.innerHTML = '<div class="empty">Loading…</div>';
        if (!contextReady) {
          setStatus('Open this plugin from inside a trip.', 'error');
          list.innerHTML = '<div class="empty">No trip context is available.</div>';
          return;
        }
        var params = new URLSearchParams({ limit: '100' });
        if (startDate.value) params.set('startDate', startDate.value);
        if (endDate.value) params.set('endDate', endDate.value);
        if (nameSearch.value.trim()) params.set('nameSearch', nameSearch.value.trim());
        window.trek.invoke('/activities?' + params.toString(), { method: 'GET' }).then(function (data) {
          if (!data || !data.ok) throw new Error((data && data.message) || 'Could not load activities.');
          activities = data.activities || [];
          setStatus('');
          render();
        }).catch(function (error) {
          activities = [];
          list.innerHTML = '<div class="error">' + escapeHtml(error.message || 'Could not load activities.') + '</div>';
          setStatus('Check the Endurain URL and access token in Settings -> Plugins.', 'error');
          updateControls();
        });
      }

      function importSelected() {
        var ids = selectedIds();
        if (!tripId || !ids.length || busy) return;
        busy = true;
        updateControls();
        setStatus('Importing selected activities…');
        window.trek.invoke('/import', { method: 'POST', body: { tripId: tripId, activityIds: ids } }).then(function (data) {
          if (!data || !data.ok) throw new Error((data && data.message) || 'Import failed.');
          var duplicates = (data.imported || []).filter(function (item) { return item.duplicate; }).length;
          var created = ids.length - duplicates;
          setStatus(created + ' activity place' + (created === 1 ? '' : 's') + ' imported' + (duplicates ? '; ' + duplicates + ' already imported.' : '.'), 'success');
          Array.prototype.slice.call(list.querySelectorAll('input[type=checkbox]')).forEach(function (input) { input.checked = false; });
        }).catch(function (error) {
          setStatus(error.message || 'Import failed.', 'error');
        }).then(function () {
          busy = false;
          updateControls();
        });
      }

      window.trek.onContext(function (context) {
        tripId = context && context.tripId ? Number(context.tripId) : null;
        contextReady = !!tripId;
        updateControls();
        if (!tripId) {
          setStatus('Open this plugin from inside a trip.', 'error');
          return;
        }
        window.trek.invoke('/trip-range?tripId=' + encodeURIComponent(tripId), { method: 'GET' }).then(function (range) {
          startDate.value = range && range.startDate || '';
          endDate.value = range && range.endDate || '';
          startDate.max = endDate.value || '';
          endDate.min = startDate.value || '';
          loadActivities();
        }).catch(function (error) {
          setStatus('Could not load trip dates: ' + (error.message || 'unknown error'), 'error');
          loadActivities();
        });
      });
      importButton.addEventListener('click', importSelected);
      list.addEventListener('change', updateControls);
      document.getElementById('refresh').addEventListener('click', loadActivities);
      searchButton.addEventListener('click', loadActivities);
      startDate.addEventListener('change', function () { endDate.min = startDate.value || ''; });
      endDate.addEventListener('change', function () { startDate.max = endDate.value || ''; });
      selectAllButton.addEventListener('click', function () {
        Array.prototype.slice.call(list.querySelectorAll('input[type=checkbox]')).forEach(function (input) { input.checked = true; });
        updateControls();
      });
    }());
  </script>
</body>
</html>
